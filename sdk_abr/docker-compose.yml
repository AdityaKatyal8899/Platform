# docker-compose.yml — SDK PIPELINE ONLY (no test_harness UI).
# Brings up the transcoding WORKER + its Redis broker, for production-like use.
# The customer's own UI/backend drives the worker (via the Redis/Celery broker
# or by calling process_video_to_hls); this file does NOT include the dev harness.
#
# Config lives in .env (loaded via env_file). Docker Compose auto-loads .env too.
#   docker compose up        # worker + redis
#   docker compose down      # stop the pipeline
#
# Note: the containerized worker runs as a Celery worker, which requires Redis.
# For the real customer deployment, run the worker container on your orchestrator
# with managed Redis + S3/CDN rather than `docker compose up` on the prod box.

services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  worker:
    build:
      context: .
      dockerfile: cowatch_sdk/container/Dockerfile
    command: ["celery", "-A", "cowatch_sdk.backends.queue.celery_app", "worker", "--loglevel=info"]
    env_file: .env
    depends_on:
      - redis
    volumes:
      - sdk_storage:/app/storage

volumes:
  sdk_storage:
